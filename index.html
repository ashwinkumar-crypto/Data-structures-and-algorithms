<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS Tracer v3</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--panel:#12121a;--border:#1e1e2e;--accent:#00f5a0;--accent2:#ff6b35;--accent3:#7c3aed;--accent4:#06b6d4;--text:#e2e8f0;--muted:#64748b;--node-bg:#1a1a2e;--highlight:#ffd700;--compare:#ff6b35;--sorted:#00f5a0;--pivot:#a855f7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;min-height:100vh;overflow-x:hidden;}
header{padding:16px 28px 12px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:14px;}
header h1{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;color:var(--accent);}
header span{font-size:.65rem;color:var(--muted);}
.layout{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 53px);}
.sidebar{background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:10px 0;}
.sidebar-label{font-size:.55rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);padding:8px 14px 4px;}
.algo-btn{display:block;width:100%;background:none;border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.72rem;text-align:left;padding:7px 14px;cursor:pointer;transition:all .15s;border-left:3px solid transparent;}
.algo-btn:hover{background:rgba(0,245,160,.05);color:var(--accent);}
.algo-btn.active{background:rgba(0,245,160,.1);border-left-color:var(--accent);color:var(--accent);}
.tag{font-size:.55rem;padding:1px 5px;border-radius:3px;margin-left:4px;background:rgba(124,58,237,.3);color:#a78bfa;}
.tag.ll{background:rgba(6,182,212,.2);color:var(--accent4);}
.tag.tree{background:rgba(255,107,53,.2);color:var(--accent2);}
.tag.expr{background:rgba(255,215,0,.2);color:var(--highlight);}
.main{display:flex;flex-direction:column;overflow:hidden;}

/* TOP TABS for expression tracer */
.expr-tabs{display:flex;gap:6px;padding:10px 16px 0;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--panel);}
.expr-tab{font-family:'JetBrains Mono',monospace;font-size:.7rem;padding:7px 13px;border-radius:6px 6px 0 0;border:1px solid var(--border);border-bottom:none;background:var(--bg);color:var(--muted);cursor:pointer;transition:all .15s;}
.expr-tab:hover{color:var(--text);}
.expr-tab.active{background:var(--panel);color:var(--accent);border-color:var(--accent);}

.controls{padding:8px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:46px;}
.ctrl-label{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.ctrl-group{display:flex;align-items:center;gap:6px;}
input[type=number],input[type=text]{background:var(--node-bg);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.75rem;padding:5px 8px;border-radius:4px;width:72px;}
input[type=text]{width:180px;}
.btn{font-family:'JetBrains Mono',monospace;font-size:.68rem;padding:5px 11px;border-radius:4px;border:1px solid;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700;}
.btn-primary:hover{background:#00d488;}
.btn-secondary{background:transparent;border-color:var(--border);color:var(--text);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-expr{background:var(--node-bg);border-color:var(--border);color:var(--text);font-size:.65rem;padding:5px 9px;border-radius:5px;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .15s;}
.btn-expr:hover,.btn-expr.active{border-color:var(--accent);color:var(--accent);}
.speed-range{accent-color:var(--accent);width:70px;}
.divider{width:1px;height:20px;background:var(--border);}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px 18px;gap:10px;}
.viz-area{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;overflow:auto;position:relative;flex:1;}
.viz-title{font-size:.55rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);position:absolute;top:8px;left:11px;}
.log-panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;height:140px;overflow-y:auto;padding:8px 12px;}
.log-title{font-size:.55rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:5px;}
.log-line{font-size:.67rem;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03);display:flex;gap:6px;}
.log-step{color:var(--accent3);min-width:32px;}
.log-msg{color:var(--text);}
.log-line.key{color:var(--accent);}
.log-line.swap{color:var(--accent2);}
.log-line.done{color:var(--accent);font-weight:700;}
.status-bar{font-size:.65rem;color:var(--accent4);padding:2px 0;}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:2px 0;}
.leg-item{display:flex;align-items:center;gap:4px;font-size:.58rem;color:var(--muted);}
.leg-dot{width:8px;height:8px;border-radius:2px;border:2px solid;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ====== ARRAY ====== */
.iter-bar{width:100%;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.3);border-radius:5px;padding:7px 12px;display:flex;gap:20px;margin-top:18px;margin-bottom:6px;flex-wrap:wrap;}
.iter-var{display:flex;align-items:center;gap:5px;}
.iter-var .vname{font-size:.6rem;color:var(--muted);}
.iter-var .vval{font-size:.8rem;font-weight:700;color:#a78bfa;min-width:24px;text-align:center;}
.iter-var .vval.active-i{color:var(--accent2);}
.iter-var .vval.active-j{color:var(--highlight);}
.cell{display:flex;flex-direction:column;align-items:center;margin:2px 2px;}
.cell-val{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;border:2px solid var(--border);border-radius:5px;background:var(--node-bg);transition:all .2s;}
.cell-idx{font-size:.5rem;color:var(--muted);margin-top:2px;}
.cell-val.highlight{background:rgba(255,215,0,.2);border-color:var(--highlight);color:var(--highlight);box-shadow:0 0 10px rgba(255,215,0,.3);}
.cell-val.compare{background:rgba(255,107,53,.2);border-color:var(--compare);color:var(--compare);}
.cell-val.sorted{background:rgba(0,245,160,.15);border-color:var(--sorted);color:var(--sorted);}
.cell-val.pivot{background:rgba(168,85,247,.25);border-color:var(--pivot);color:var(--pivot);}
.cell-val.found{background:rgba(0,245,160,.3);border-color:var(--accent);color:var(--accent);animation:pulse .5s ease 3;}
.cell-val.current{border-color:var(--accent4);color:var(--accent4);background:rgba(6,182,212,.1);}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* ====== LINKED LIST ====== */
.ll-wrap{display:flex;align-items:center;flex-wrap:wrap;gap:0;padding-top:20px;}
.ll-node-box{display:flex;flex-direction:column;align-items:center;}
.ll-box{display:flex;border:2px solid var(--border);border-radius:6px;overflow:hidden;background:var(--node-bg);transition:all .2s;}
.ll-box.sll .ll-data{border-right:1px solid var(--border);}
.ll-box.dll{flex-direction:column;}
.ll-box.dll .ll-row{display:flex;width:100%;}
.ll-box.dll .ll-prev{padding:4px 7px;font-size:.58rem;color:var(--accent3);border-bottom:1px solid var(--border);border-right:1px solid var(--border);min-width:26px;text-align:center;}
.ll-box.dll .ll-data-mid{padding:4px 9px;font-size:.8rem;font-weight:700;border-bottom:1px solid var(--border);flex:1;text-align:center;}
.ll-box.dll .ll-next-r{padding:4px 7px;font-size:.58rem;color:var(--muted);border-bottom:1px solid var(--border);border-left:1px solid var(--border);min-width:26px;text-align:center;}
.ll-box.dll .ll-addr{font-size:.5rem;color:var(--muted);padding:2px 6px;text-align:center;width:100%;}
.ll-data{padding:6px 10px;font-size:.8rem;font-weight:700;min-width:32px;text-align:center;}
.ll-next{padding:6px 8px;font-size:.58rem;color:var(--muted);min-width:24px;text-align:center;}
.ll-arrow{font-size:.9rem;color:var(--accent4);margin:0 3px;align-self:center;}
.ll-arrow.back{color:var(--accent3);}
.ll-null{font-size:.65rem;color:var(--muted);padding:0 6px;align-self:center;}
.ll-box.highlight{border-color:var(--highlight);}
.ll-box.highlight .ll-data,.ll-box.highlight .ll-data-mid{color:var(--highlight);}
.ll-box.found{border-color:var(--accent);}
.ll-box.found .ll-data,.ll-box.found .ll-data-mid{color:var(--accent);}
.ll-box.current{border-color:var(--accent4);}
.ll-box.current .ll-data,.ll-box.current .ll-data-mid{color:var(--accent4);}
.ll-box.compare{border-color:var(--compare);}
.ll-box.compare .ll-data,.ll-box.compare .ll-data-mid{color:var(--compare);}
.ll-box.sorted{border-color:var(--sorted);}
.ll-box.sorted .ll-data,.ll-box.sorted .ll-data-mid{color:var(--sorted);}
.ll-addr-label{font-size:.48rem;color:var(--accent3);margin-top:3px;}
/* circular arrow */
.cll-back-arrow{font-size:.65rem;color:var(--accent3);padding:0 5px;align-self:center;}

/* ====== STACK / QUEUE ====== */
.sq-cell{padding:8px 16px;border:2px solid var(--border);border-radius:5px;background:var(--node-bg);font-weight:700;font-size:.85rem;transition:all .2s;min-width:48px;text-align:center;}
.sq-cell.top{border-color:var(--accent);color:var(--accent);background:rgba(0,245,160,.1);}
.sq-cell.front{border-color:var(--accent4);color:var(--accent4);background:rgba(6,182,212,.1);}
.sq-cell.back{border-color:var(--accent2);color:var(--accent2);background:rgba(255,107,53,.1);}
.sq-label{font-size:.5rem;text-align:center;color:var(--muted);margin-top:2px;}

/* ====== TREE ====== */
.tree-svg-wrap{width:100%;overflow-x:auto;padding-top:20px;}
svg.tree-svg{display:block;margin:0 auto;}
.tree-node-circle{fill:var(--node-bg);stroke:var(--border);stroke-width:2;transition:fill .25s,stroke .25s;}
.tree-node-circle.tn-current{fill:rgba(6,182,212,.18);stroke:var(--accent4);}
.tree-node-circle.tn-done{fill:rgba(0,245,160,.18);stroke:var(--sorted);}
.tree-edge{stroke:var(--border);stroke-width:1.5;fill:none;}
.tree-edge.te-active{stroke:var(--accent4);stroke-width:2;}
.tree-node-text{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none;}
.trav-order{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.trav-badge{padding:3px 9px;border-radius:4px;font-size:.65rem;font-weight:700;background:var(--node-bg);border:1px solid var(--border);color:var(--muted);transition:all .2s;}
.trav-badge.active{border-color:var(--accent);color:var(--accent);background:rgba(0,245,160,.1);}

/* ====== EXPRESSION TRACER ====== */
.expr-section{display:flex;flex-direction:column;gap:10px;height:100%;overflow-y:auto;}
.expr-preset-row{display:flex;gap:6px;flex-wrap:wrap;}
.expr-io-row{display:grid;grid-template-columns:1fr 1fr 120px;gap:8px;}
.expr-box{background:var(--node-bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;}
.expr-box-label{font-size:.55rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px;}
.expr-box-val{font-size:.95rem;font-weight:700;color:var(--accent);min-height:22px;}
.expr-table{width:100%;border-collapse:collapse;font-size:.7rem;}
.expr-table th{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);text-align:left;padding:5px 10px;border-bottom:1px solid var(--border);}
.expr-table td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
.expr-table tr:last-child td{border-bottom:none;}
.expr-table tr.active-row td{background:rgba(0,245,160,.06);}
.et-token{font-weight:700;color:var(--accent4);}
.et-token.op{color:var(--accent2);}
.et-token.paren{color:var(--highlight);}
.et-token.end{color:var(--muted);}
.et-action{color:var(--text);}
.et-stack{color:#a78bfa;font-weight:700;}
.et-output{color:var(--accent);font-weight:700;}
.expr-stack-visual{display:flex;align-items:flex-end;gap:4px;margin-top:4px;}
.expr-stack-cell{padding:5px 10px;border:1.5px solid var(--border);border-radius:4px;background:var(--node-bg);font-size:.75rem;font-weight:700;color:var(--text);transition:all .2s;}
.expr-stack-cell.new{border-color:var(--accent);color:var(--accent);background:rgba(0,245,160,.1);}
.prec-table{width:100%;border-collapse:collapse;font-size:.72rem;}
.prec-table th{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);text-align:left;padding:6px 12px;border-bottom:1px solid var(--border);}
.prec-table td{padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.04);}
.prec-op{font-size:.95rem;font-weight:700;color:var(--accent4);min-width:32px;display:inline-block;}
</style>
</head>
<body>
<header>
  <h1>DS Tracer v3</h1>
  <span>Array · Linked List · Stack · Queue · Tree · Expression</span>
</header>
<div class="layout">
<nav class="sidebar">
  <div class="sidebar-label">🔍 Search — Array</div>
  <button class="algo-btn active" onclick="sel('linear-array')" id="btn-linear-array">Linear Search <span class="tag">ARR</span></button>
  <button class="algo-btn" onclick="sel('binary-array')" id="btn-binary-array">Binary Search <span class="tag">ARR</span></button>
  <div class="sidebar-label">🔍 Search — LL</div>
  <button class="algo-btn" onclick="sel('linear-ll')" id="btn-linear-ll">Linear Search <span class="tag ll">SLL</span></button>
  <div class="sidebar-label">⚙ Sort — Array</div>
  <button class="algo-btn" onclick="sel('bubble-array')" id="btn-bubble-array">Bubble Sort <span class="tag">ARR</span></button>
  <button class="algo-btn" onclick="sel('selection-array')" id="btn-selection-array">Selection Sort <span class="tag">ARR</span></button>
  <button class="algo-btn" onclick="sel('insertion-array')" id="btn-insertion-array">Insertion Sort <span class="tag">ARR</span></button>
  <button class="algo-btn" onclick="sel('merge-array')" id="btn-merge-array">Merge Sort <span class="tag">ARR</span></button>
  <button class="algo-btn" onclick="sel('quick-array')" id="btn-quick-array">Quick Sort <span class="tag">ARR</span></button>
  <div class="sidebar-label">⚙ Sort — LL</div>
  <button class="algo-btn" onclick="sel('bubble-ll')" id="btn-bubble-ll">Bubble Sort <span class="tag ll">SLL</span></button>
  <button class="algo-btn" onclick="sel('selection-ll')" id="btn-selection-ll">Selection Sort <span class="tag ll">SLL</span></button>
  <button class="algo-btn" onclick="sel('insertion-ll')" id="btn-insertion-ll">Insertion Sort <span class="tag ll">SLL</span></button>
  <div class="sidebar-label">🔗 Linked Lists</div>
  <button class="algo-btn" onclick="sel('sll-ops')" id="btn-sll-ops">Singly LL <span class="tag ll">SLL</span></button>
  <button class="algo-btn" onclick="sel('dll-ops')" id="btn-dll-ops">Doubly LL <span class="tag ll">DLL</span></button>
  <button class="algo-btn" onclick="sel('cll-ops')" id="btn-cll-ops">Circular LL <span class="tag ll">CLL</span></button>
  <div class="sidebar-label">📦 Stack</div>
  <button class="algo-btn" onclick="sel('stack-array')" id="btn-stack-array">Stack — Array <span class="tag">ARR</span></button>
  <button class="algo-btn" onclick="sel('stack-ll')" id="btn-stack-ll">Stack — LL <span class="tag ll">SLL</span></button>
  <div class="sidebar-label">📬 Queue</div>
  <button class="algo-btn" onclick="sel('queue-array')" id="btn-queue-array">Queue — Array <span class="tag">ARR</span></button>
  <button class="algo-btn" onclick="sel('queue-ll')" id="btn-queue-ll">Queue — LL <span class="tag ll">SLL</span></button>
  <div class="sidebar-label">🌳 Tree Traversal</div>
  <button class="algo-btn" onclick="sel('inorder-tree')" id="btn-inorder-tree">Inorder <span class="tag tree">BST</span></button>
  <button class="algo-btn" onclick="sel('preorder-tree')" id="btn-preorder-tree">Preorder <span class="tag tree">BST</span></button>
  <button class="algo-btn" onclick="sel('postorder-tree')" id="btn-postorder-tree">Postorder <span class="tag tree">BST</span></button>
  <button class="algo-btn" onclick="sel('levelorder-tree')" id="btn-levelorder-tree">Level Order <span class="tag tree">BST</span></button>
  <button class="algo-btn" onclick="sel('bstsearch-tree')" id="btn-bstsearch-tree">BST Search <span class="tag tree">BST</span></button>
  <div class="sidebar-label">🧮 Expression</div>
  <button class="algo-btn" onclick="sel('expr')" id="btn-expr">Expression Tracer <span class="tag expr">EXP</span></button>
</nav>

<div class="main" id="main-panel">
  <!-- normal controls -->
  <div class="controls" id="normal-controls">
    <div class="ctrl-group">
      <span class="ctrl-label">Data</span>
      <input type="text" id="input-data" value="5,3,8,1,9,2,7,4,6">
    </div>
    <div class="ctrl-group" id="target-group" style="display:none">
      <span class="ctrl-label">Target</span>
      <input type="number" id="input-target" value="7" min="0" max="99">
    </div>
    <div class="divider"></div>
    <div class="ctrl-group">
      <span class="ctrl-label">Speed</span>
      <input type="range" id="speed" class="speed-range" min="1" max="10" value="5">
    </div>
    <button class="btn btn-primary" onclick="runAlgo()">▶ Run</button>
    <button class="btn btn-secondary" onclick="resetAlgo()">↺ Reset</button>
    <div class="divider"></div>
    <div class="ctrl-group" id="sq-ops" style="display:none">
      <input type="number" id="sq-val" placeholder="val" style="width:52px" min="0" max="99">
      <button class="btn btn-secondary" onclick="sqPush()">Push/Enq</button>
      <button class="btn btn-secondary" onclick="sqPop()">Pop/Deq</button>
      <button class="btn btn-secondary" onclick="sqPeek()">Peek</button>
    </div>
    <div class="ctrl-group" id="ll-ops" style="display:none">
      <input type="number" id="ll-val" placeholder="val" style="width:52px" min="0" max="99">
      <input type="number" id="ll-pos" placeholder="pos" style="width:52px" min="0" max="99">
      <button class="btn btn-secondary" onclick="llInsert()">Insert</button>
      <button class="btn btn-secondary" onclick="llDelete()">Delete</button>
      <button class="btn btn-secondary" onclick="llSearch()">Search</button>
    </div>
  </div>

  <div class="content" id="normal-content">
    <div>
      <div class="status-bar" id="status">Select an algorithm and click Run</div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="viz-area" id="viz">
      <span style="color:var(--muted);font-size:.78rem">Select an algorithm →</span>
    </div>
    <div class="log-panel">
      <div class="log-title">Trace Log</div>
      <div id="log"></div>
    </div>
  </div>

  <!-- EXPRESSION PANEL (hidden by default) -->
  <div id="expr-panel" style="display:none;flex:1;overflow:hidden;display:none;flex-direction:column;">
    <div class="expr-tabs" id="expr-tabs">
      <button class="expr-tab active" onclick="setExprMode('i2p')" id="etab-i2p">Infix → Postfix</button>
      <button class="expr-tab" onclick="setExprMode('i2pre')" id="etab-i2pre">Infix → Prefix</button>
      <button class="expr-tab" onclick="setExprMode('p2i')" id="etab-p2i">Postfix → Infix</button>
      <button class="expr-tab" onclick="setExprMode('pre2i')" id="etab-pre2i">Prefix → Infix</button>
      <button class="expr-tab" onclick="setExprMode('prec')" id="etab-prec">Precedence Ref</button>
    </div>
    <div style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);">
      <span class="ctrl-label">Presets:</span>
      <div class="expr-preset-row" id="expr-presets"></div>
      <div class="divider"></div>
      <span class="ctrl-label">Custom:</span>
      <input type="text" id="expr-input" value="A + B * C" style="width:160px;">
      <button class="btn btn-primary" onclick="runExpr()">▶ Trace</button>
      <button class="btn btn-secondary" onclick="resetExpr()">↺ Reset</button>
    </div>
    <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;padding:12px 18px;gap:10px;">
      <div id="expr-content" style="flex:1;overflow-y:auto;"></div>
      <div class="log-panel">
        <div class="log-title">Trace Log</div>
        <div id="expr-log"></div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
let currentAlgo='linear-array', isRunning=false, stopFlag=false, sqData=[], llData=[];
let exprMode='i2p';

/* ====================================================
   NAVIGATION
====================================================*/
function sel(a){
  document.querySelectorAll('.algo-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+a).classList.add('active');
  currentAlgo=a; stopFlag=true; isRunning=false;
  const isExpr=a==='expr';
  document.getElementById('expr-panel').style.display=isExpr?'flex':'none';
  document.getElementById('normal-controls').style.display=isExpr?'none':'flex';

/* ====================================================
   TREE
====================================================*/
function buildBST(vals){
  let root=null;
  function insert(node,v){
    if(!node) return{val:v,left:null,right:null};
    if(v<node.val) node.left=insert(node.left,v);
    else if(v>node.val) node.right=insert(node.right,v);
    return node;
  }
  vals.forEach(v=>{root=insert(root,v);});
  return root;
}
function layoutTree(root){
  const nodes=[],edges=[];let xC=0;
  function assign(node,d){if(!node)return;assign(node.left,d+1);node._x=xC++;node._y=d;assign(node.right,d+1);}
  assign(root,0);
  function collect(node){if(!node)return;nodes.push(node);if(node.left){edges.push({from:node,to:node.left});collect(node.left);}if(node.right){edges.push({from:node,to:node.right});collect(node.right);}}
  collect(root);return{nodes,edges};
}
let treeRoot=null,treeVisited=new Set(),treeOrder=[];
function renderTree(highlighted=null,visitedSet=new Set(),orderArr=[]){
  const viz=document.getElementById('viz');
  viz.innerHTML='<span class="viz-title">Binary Search Tree</span>';
  if(!treeRoot){viz.innerHTML+='<span style="color:var(--muted);font-size:.78rem;margin-top:20px;display:block">Build tree from data then Run</span>';return;}
  const{nodes,edges}=layoutTree(treeRoot);
  const R=20,hGap=42,vGap=55;
  const maxX=Math.max(...nodes.map(n=>n._x));const maxY=Math.max(...nodes.map(n=>n._y));
  const W=Math.max(380,(maxX+1)*hGap+R*2);const H=(maxY+1)*vGap+R*2+20;
  const ox=R+hGap/2;
  function cx(n){return ox+n._x*hGap;}function cy(n){return R+18+n._y*vGap;}
  const wrap=document.createElement('div'); wrap.className='tree-svg-wrap';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',W);svg.setAttribute('height',H);svg.classList.add('tree-svg');
  edges.forEach(e=>{
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',cx(e.from));line.setAttribute('y1',cy(e.from));line.setAttribute('x2',cx(e.to));line.setAttribute('y2',cy(e.to));
    line.classList.add('tree-edge');if(highlighted===e.to.val)line.classList.add('te-active');svg.appendChild(line);
  });
  nodes.forEach(n=>{
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',cx(n));c.setAttribute('cy',cy(n));c.setAttribute('r',R);c.classList.add('tree-node-circle');
    if(n.val===highlighted)c.classList.add('tn-current');else if(visitedSet.has(n.val))c.classList.add('tn-done');
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',cx(n));t.setAttribute('y',cy(n));t.classList.add('tree-node-text');t.textContent=n.val;
    g.appendChild(c);g.appendChild(t);svg.appendChild(g);
  });
  wrap.appendChild(svg);viz.appendChild(wrap);
  if(orderArr.length){
    const lbl=document.createElement('div');lbl.style.cssText='font-size:.58rem;color:var(--muted);margin-top:7px;text-transform:uppercase;letter-spacing:1px;';lbl.textContent='Visit Order:';viz.appendChild(lbl);
    const row=document.createElement('div');row.className='trav-order';
    orderArr.forEach(v=>{const b=document.createElement('div');b.className='trav-badge'+(v===highlighted?' active':'');b.textContent=v;row.appendChild(b);});
    viz.appendChild(row);
  }
}

async function treeTraversal(type){
  treeRoot=buildBST(getData());treeVisited=new Set();treeOrder=[];let step=0;
  renderTree(null,treeVisited,treeOrder);log(++step,`Built BST from [${getData().join(', ')}]`);await sleep(spd());
  async function inorder(node){if(!node||stopFlag)return;await inorder(node.left);if(stopFlag)return;treeOrder.push(node.val);setStatus(`Visiting ${node.val}`);renderTree(node.val,new Set(treeOrder.slice(0,-1)),treeOrder);log(++step,`Visit ${node.val} → [${treeOrder.join(', ')}]`,'key');await sleep(spd());treeVisited.add(node.val);await inorder(node.right);}
  async function preorder(node){if(!node||stopFlag)return;treeOrder.push(node.val);setStatus(`Visiting ${node.val}`);renderTree(node.val,new Set(treeOrder.slice(0,-1)),treeOrder);log(++step,`Visit ${node.val} → [${treeOrder.join(', ')}]`,'key');await sleep(spd());treeVisited.add(node.val);await preorder(node.left);await preorder(node.right);}
  async function postorder(node){if(!node||stopFlag)return;await postorder(node.left);await postorder(node.right);if(stopFlag)return;treeOrder.push(node.val);setStatus(`Visiting ${node.val}`);renderTree(node.val,new Set(treeOrder.slice(0,-1)),treeOrder);log(++step,`Visit ${node.val} → [${treeOrder.join(', ')}]`,'key');await sleep(spd());treeVisited.add(node.val);}
  async function levelorder(root){if(!root)return;const q=[root];let lvl=0;while(q.length&&!stopFlag){const sz=q.length;log(++step,`Level ${lvl}: ${q.map(x=>x.val).join(', ')}`);for(let k=0;k<sz&&!stopFlag;k++){const node=q.shift();treeOrder.push(node.val);setStatus(`BFS Level ${lvl}: visiting ${node.val}`);renderTree(node.val,new Set(treeOrder.slice(0,-1)),treeOrder);log(++step,`Visit ${node.val}`,'key');await sleep(spd());treeVisited.add(node.val);if(node.left)q.push(node.left);if(node.right)q.push(node.right);}lvl++;}}
  if(type==='inorder')await inorder(treeRoot);
  else if(type==='preorder')await preorder(treeRoot);
  else if(type==='postorder')await postorder(treeRoot);
  else if(type==='levelorder')await levelorder(treeRoot);
  if(!stopFlag){renderTree(null,treeVisited,treeOrder);setStatus(`✓ ${type}: [${treeOrder.join(', ')}]`);log(++step,`Done: [${treeOrder.join(', ')}]`,'done');}
}
async function bstSearch(){
  treeRoot=buildBST(getData());const target=getTarget();let node=treeRoot,step=0;
  renderTree(null,new Set(),[]);log(++step,`BST Search for ${target}`);await sleep(spd());
  while(node&&!stopFlag){
    renderTree(node.val,new Set(),[]);setStatus(`At ${node.val}: compare with ${target}`);
    log(++step,`Node=${node.val}  ${node.val===target?'← MATCH!':node.val>target?'go LEFT':'go RIGHT'}`);
    await sleep(spd());
    if(node.val===target){renderTree(node.val,new Set([node.val]),[node.val]);setStatus(`✓ Found ${target}`);log(++step,`Found`,'done');return;}
    node=target<node.val?node.left:node.right;
  }
  setStatus(`✗ ${target} not found`);log(++step,'Not found','swap');
}

async function linearSearchArray(){let arr=getData(),target=getTarget(),step=0;for(let i=0;i<arr.length;i++){if(stopFlag)return;renderArray(arr,{[i]:'highlight'},[{name:'i',val:i,cls:'active-i'},{name:'arr[i]',val:arr[i]},{name:'target',val:target}]);setStatus(`i=${i}: ${arr[i]} vs ${target}`);log(++step,`i=${i}  arr[i]=${arr[i]}${arr[i]===target?' ← MATCH!':''}`);await sleep(spd());if(arr[i]===target){renderArray(arr,{[i]:'found'},[{name:'FOUND',val:arr[i]}]);setStatus(`✓ Found at i=${i}`);log(++step,`Found`,'done');return;}}setStatus(`✗ Not found`);log(++step,'Not found','swap');}
async function binarySearchArray(){let arr=[...getData()].sort((a,b)=>a-b),target=getTarget(),step=0;let lo=0,hi=arr.length-1;log(++step,`Sorted: [${arr.join(', ')}]`);while(lo<=hi){if(stopFlag)return;const mid=Math.floor((lo+hi)/2);const s={};for(let i=lo;i<=hi;i++)s[i]='current';s[mid]='highlight';renderArray(arr,s,[{name:'lo',val:lo,cls:'active-i'},{name:'mid',val:mid,cls:'active-j'},{name:'hi',val:hi},{name:'arr[mid]',val:arr[mid]}]);setStatus(`lo=${lo} mid=${mid} hi=${hi}  arr[mid]=${arr[mid]} vs ${target}`);log(++step,`lo=${lo} hi=${hi} mid=${mid} arr[mid]=${arr[mid]}`);await sleep(spd());if(arr[mid]===target){renderArray(arr,{[mid]:'found'},[{name:'FOUND',val:target}]);setStatus(`✓ Found at i=${mid}`);log(++step,`Found`,'done');return;}else if(arr[mid]<target){log(++step,`go right → lo=${mid+1}`,'key');lo=mid+1;}else{log(++step,`go left → hi=${mid-1}`,'key');hi=mid-1;}await sleep(spd()*.4);}setStatus(`✗ Not found`);log(++step,'Not found','swap');}
async function linearSearchLL(){let arr=getData(),target=getTarget(),step=0;for(let i=0;i<arr.length;i++){if(stopFlag)return;renderSLL(arr,{[i]:'highlight'});setStatus(`i=${i}: ${arr[i]} vs ${target}`);log(++step,`i=${i}  node.data=${arr[i]}${arr[i]===target?' ← MATCH!':''}`);await sleep(spd());if(arr[i]===target){renderSLL(arr,{[i]:'found'});setStatus(`✓ Found at node ${i}`);log(++step,`Found`,'done');return;}}setStatus(`✗ Not found`);log(++step,'Not found','swap');}

async function quickSortArray(){let arr=[...getData()],step=[0];async function partition(a,lo,hi){let pivot=a[hi],i=lo-1;log(++step[0],`Partition [${lo}..${hi}] pivot=${pivot}`);for(let j=lo;j<hi;j++){if(stopFlag)return lo;const s={};s[hi]='pivot';for(let k=lo;k<=i;k++)s[k]='sorted';s[j]='highlight';renderArray(a,s,[{name:'i',val:i,cls:'active-i'},{name:'j',val:j,cls:'active-j'},{name:'pivot',val:pivot}]);setStatus(`i=${i} j=${j}  arr[j]=${a[j]} vs pivot=${pivot}`);log(++step[0],`i=${i} j=${j}  arr[j]=${a[j]} vs pivot=${pivot}`);await sleep(spd());if(a[j]<=pivot){i++;[a[i],a[j]]=[a[j],a[i]];if(i!==j)log(++step[0],`Swap i=${i}↔j=${j}`,'swap');}}[a[i+1],a[hi]]=[a[hi],a[i+1]];log(++step[0],`Pivot ${pivot} → pos ${i+1}`,'key');return i+1;}async function qs(a,lo,hi){if(lo>=hi||stopFlag)return;const p=await partition(a,lo,hi);await qs(a,lo,p-1);await qs(a,p+1,hi);}await qs(arr,0,arr.length-1);if(!stopFlag){const s={};arr.forEach((_,i)=>s[i]='sorted');renderArray(arr,s,[]);setStatus(`✓ Sorted`);log(++step[0],'Done','done');}}

const PRESETS_I2P=['A + B * C','(A + B) * C','A * B + C * D','(A + B) * (C - D)','A ^ B ^ C'];
const PRESETS_I2PRE=['A + B * C','(A + B) * C','A * B + C * D','(A + B) * (C - D)'];
const PRESETS_P2I=['A B C * +','A B + C *','A B C D * + *','A B + C D - *'];
const PRESETS_PRE2I=['+ A * B C','* + A B C','* + A B + C D','* + A B - C D'];

function setExprMode(m){
  exprMode=m;
  document.querySelectorAll('.expr-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('etab-'+m).classList.add('active');
  // update presets
  const presetsEl=document.getElementById('expr-presets');
  presetsEl.innerHTML='';
  let presets=[];
  if(m==='i2p') presets=PRESETS_I2P;
  else if(m==='i2pre') presets=PRESETS_I2PRE;
  else if(m==='p2i') presets=PRESETS_P2I;
  else if(m==='pre2i') presets=PRESETS_PRE2I;
  presets.forEach(p=>{
    const btn=document.createElement('button'); btn.className='btn-expr'; btn.textContent=p;
    btn.onclick=()=>{document.getElementById('expr-input').value=p;runExpr();};
    presetsEl.appendChild(btn);
  });
  if(m==='prec'){document.getElementById('expr-presets').innerHTML='<span style="font-size:.6rem;color:var(--muted)">Operator precedence reference table</span>';}
  document.getElementById('expr-content').innerHTML='';
  document.getElementById('expr-log').innerHTML='';
}

function prec(op){return op==='^'?3:op==='*'||op==='/'?2:op==='+'||op==='-'?1:0;}
function isOp(c){return ['+','-','*','/','**','^'].includes(c);}
function isOperand(c){return /^[A-Za-z0-9]+$/.test(c) && !isOp(c);}

// tokenize: split string into tokens
function tokenize(s){return s.trim().split(/\s+/);}

function runExpr(){
  const s=document.getElementById('expr-input').value.trim();
  document.getElementById('expr-log').innerHTML='';
  if(exprMode==='i2p') traceI2P(s);
  else if(exprMode==='i2pre') traceI2Pre(s);
  else if(exprMode==='p2i') traceP2I(s);
  else if(exprMode==='pre2i') tracePre2I(s);
  else if(exprMode==='prec') showPrecTable();
}
function resetExpr(){document.getElementById('expr-content').innerHTML='';document.getElementById('expr-log').innerHTML='';}

function exprLog(step,msg,type=''){
  const el=document.getElementById('expr-log');
  const d=document.createElement('div'); d.className='log-line '+type;
  d.innerHTML=`<span class="log-step">S${step}</span><span class="log-msg">${msg}</span>`;
  el.appendChild(d); el.scrollTop=el.scrollHeight;
}

/* ---- Infix → Postfix (Shunting Yard) ---- */
function traceI2P(expr){
  const tokens=tokenize(expr);
  const stack=[], output=[];
  const rows=[];
  tokens.forEach((tok,idx)=>{
    let action='';
    if(isOperand(tok)){
      output.push(tok); action='Operand → output directly';
    } else if(tok==='('){
      stack.push(tok); action='Push ( onto stack';
    } else if(tok===')'){
      while(stack.length&&stack[stack.length-1]!=='(') output.push(stack.pop());
      stack.pop(); action='Pop until ( → discard (';
    } else if(isOp(tok)){
      while(stack.length&&stack[stack.length-1]!=='('&&prec(stack[stack.length-1])>=prec(tok)&&tok!=='^'){
        output.push(stack.pop());
      }
      stack.push(tok);
      action='Push '+tok+' (lower/eq prec ops popped first)';
    }
    rows.push({tok,action,stack:[...stack],output:[...output]});
    exprLog(idx+1,`[${tok}] ${action}  stack:[${[...stack].join(',')}]  out:[${output.join(' ')}]`);
  });
  // flush
  while(stack.length){output.push(stack.pop());}
  rows.push({tok:'(end)',action:'Pop all remaining operators',stack:[],output:[...output],isEnd:true});
  exprLog(rows.length,'(end) Pop all remaining operators  output: '+output.join(' '),'done');
  renderExprTable(expr,'Postfix (output)',output.join(' '),rows,tokens);
}

/* ---- Infix → Prefix ---- */
function traceI2Pre(expr){
  // reverse, swap parens, i2p, reverse
  const tokens=tokenize(expr);
  const reversed=[...tokens].reverse().map(t=>t==='('?')':t===')'?'(':t);
  const stack=[], output=[];
  const rows=[];
  reversed.forEach((tok,idx)=>{
    let action='';
    if(isOperand(tok)){
      output.push(tok); action='Operand → output';
    } else if(tok==='('){
      stack.push(tok); action='Push (';
    } else if(tok===')'){
      while(stack.length&&stack[stack.length-1]!=='(') output.push(stack.pop());
      stack.pop(); action='Pop until (';
    } else if(isOp(tok)){
      while(stack.length&&stack[stack.length-1]!=='('&&prec(stack[stack.length-1])>prec(tok)){
        output.push(stack.pop());
      }
      stack.push(tok); action='Push '+tok;
    }
    rows.push({tok,action,stack:[...stack],output:[...output]});
    exprLog(idx+1,`[${tok}] ${action}  stack:[${[...stack].join(',')}]  out:[${output.join(' ')}]`);
  });
  while(stack.length) output.push(stack.pop());
  const prefix=output.reverse().join(' ');
  rows.push({tok:'(end)',action:'Reverse output → Prefix',stack:[],output:prefix.split(' '),isEnd:true});
  exprLog(rows.length,'(end) Reversed → '+prefix,'done');
  renderExprTable(expr,'Prefix (output)',prefix,rows,reversed);
}

/* ---- Postfix → Infix ---- */
function traceP2I(expr){
  const tokens=tokenize(expr);
  const stack=[];
  const rows=[];
  tokens.forEach((tok,idx)=>{
    let action='';
    if(isOperand(tok)){
      stack.push(tok); action='Operand → push onto stack';
    } else if(isOp(tok)){
      const b=stack.pop(), a=stack.pop();
      const res='('+a+' '+tok+' '+b+')';
      stack.push(res); action=`Pop ${a}, ${b} → push (${a} ${tok} ${b})`;
    }
    rows.push({tok,action,stack:[...stack],output:[...stack]});
    exprLog(idx+1,`[${tok}] ${action}  stack:[${stack.join(' | ')}]`);
  });
  const result=stack[0]||'';
  rows.push({tok:'(end)',action:'Top of stack = infix result',stack:[result],output:[result],isEnd:true});
  exprLog(rows.length,'(end) Infix: '+result,'done');
  renderExprTable(expr,'Infix (output)',result,rows,tokens);
}

/* ---- Prefix → Infix ---- */
function tracePre2I(expr){
  const tokens=tokenize(expr).reverse();
  const stack=[];
  const rows=[];
  tokens.forEach((tok,idx)=>{
    let action='';
    if(isOperand(tok)){
      stack.push(tok); action='Operand → push';
    } else if(isOp(tok)){
      const a=stack.pop(), b=stack.pop();
      const res='('+a+' '+tok+' '+b+')';
      stack.push(res); action=`Pop ${a}, ${b} → push (${a} ${tok} ${b})`;
    }
    rows.push({tok,action,stack:[...stack],output:[...stack]});
    exprLog(idx+1,`[${tok}] ${action}  stack:[${stack.join(' | ')}]`);
  });
  const result=stack[0]||'';
  rows.push({tok:'(end)',action:'Top of stack = infix result',stack:[result],output:[result],isEnd:true});
  exprLog(rows.length,'(end) Infix: '+result,'done');
  renderExprTable(expr,'Infix (output)',result,rows,[...tokens].reverse());
}

  table.innerHTML=`<thead><tr><th>TOKEN</th><th>ACTION</th><th>STACK</th><th>OUTPUT</th></tr></thead>`;

    tbody.appendChild(tr);

  table.appendChild(tbody); tableWrap.appendChild(table); sec.appendChild(tableWrap);

async function runAlgo(){
  if(isRunning) return;
  stopFlag=false; isRunning=true; clearLog(); setStatus('Running…');
  const map={
    'linear-array':linearSearchArray,'binary-array':binarySearchArray,'linear-ll':linearSearchLL,
    'bubble-array':bubbleSortArray,'selection-array':selectionSortArray,'insertion-array':insertionSortArray,
    'merge-array':mergeSortArray,'quick-array':quickSortArray,
    'bubble-ll':bubbleSortLL,'selection-ll':selectionSortLL,'insertion-ll':insertionSortLL,
  };
  const isSQ=currentAlgo.startsWith('stack')||currentAlgo.startsWith('queue');
  const isLLOps=currentAlgo.endsWith('-ops');
  const treeMap={'inorder-tree':'inorder','preorder-tree':'preorder','postorder-tree':'postorder','levelorder-tree':'levelorder'};
  if(isSQ){sqData=getData();setStatus('Use Push/Pop/Peek buttons');log(1,`Initialized [${sqData.join(', ')}]`);log(2,currentAlgo.startsWith('stack')?'LIFO — Stack':'FIFO — Queue');renderSQ();}
  else if(isLLOps){llData=getData();setStatus('Use Insert/Delete/Search buttons');log(1,`Loaded [${llData.join(', ')}] into ${currentAlgo.replace('-ops','').toUpperCase()}`);llRender();}
  else if(currentAlgo==='bstsearch-tree') await bstSearch();
  else if(treeMap[currentAlgo]) await treeTraversal(treeMap[currentAlgo]);
  else if(map[currentAlgo]) await map[currentAlgo]();
  isRunning=false;
}

function resetAlgo(){
  stopFlag=true; isRunning=false; sqData=[]; llData=[];
  clearLog(); setStatus('Ready');
  const isTree=currentAlgo.endsWith('-tree');
  const isSQ=currentAlgo.startsWith('stack')||currentAlgo.startsWith('queue');
  const isLLOps=currentAlgo.endsWith('-ops');
  const isLL=currentAlgo.endsWith('-ll')&&!isTree&&!isLLOps;
  if(isSQ){if(currentAlgo.startsWith('stack'))renderStack([]);else renderQueue([]);}
  else if(isLLOps){
    if(currentAlgo==='sll-ops')renderSLL(getData(),{});
    else if(currentAlgo==='dll-ops')renderDLL(getData(),{});
    else renderCLL(getData(),{});
    llData=getData();
  }
  else if(isTree){treeRoot=buildBST(getData());treeVisited=new Set();treeOrder=[];renderTree(null,new Set(),[]);}
  else if(isLL)renderSLL(getData(),{});
  else renderArray(getData(),{});
}

function updateLegend(){
  const isSQ=currentAlgo.startsWith('stack')||currentAlgo.startsWith('queue');
  const isLLOps=currentAlgo.endsWith('-ops');
  const isTree=currentAlgo.endsWith('-tree');
  const el=document.getElementById('legend');
  if(isSQ||isLLOps){el.innerHTML='';return;}
  if(isTree){el.innerHTML=`<div class="leg-item"><div class="leg-dot" style="border-color:var(--accent4)"></div> Current</div><div class="leg-item"><div class="leg-dot" style="border-color:var(--sorted)"></div> Visited</div>`;return;}
  el.innerHTML=`
    <div class="leg-item"><div class="leg-dot" style="border-color:var(--highlight)"></div> i (outer)</div>
    <div class="leg-item"><div class="leg-dot" style="border-color:var(--compare)"></div> j (inner)</div>
    <div class="leg-item"><div class="leg-dot" style="border-color:var(--sorted)"></div> Sorted/Found</div>
    <div class="leg-item"><div class="leg-dot" style="border-color:var(--pivot)"></div> Pivot</div>`;
}

// INIT
sel('linear-array');
document.getElementById('target-group').style.display='flex';
</script>
</body>
